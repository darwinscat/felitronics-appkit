# felitronics-appkit CI — the JUCE-free tier everywhere; the JUCE consumer-compile gate on macOS
# (native URL backend, no system deps) so UpdateChecker.h is COMPILED on every push even though no
# product build runs here.
name: tests

on:
  push:
    branches: [main]
  pull_request:

# The job token gets only what this workflow needs: it checks out and builds, it never
# writes to the repository. CodeQL's one finding in this family, ever, was a workflow
# without this block.
permissions:
  contents: read

# One live run per branch or pull request: a push on top of a push cancels the run it
# replaced instead of finishing it against code nobody will merge.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }}${{ matrix.juce == 'ON' && ' + JUCE gate' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            juce: "OFF"
          - os: windows-latest
            juce: "OFF"
          - os: macos-latest
            juce: "ON"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DFELITRONICS_APPKIT_TESTS_WITH_JUCE=${{ matrix.juce }}
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
